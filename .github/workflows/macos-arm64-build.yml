name: macOS ARM64 Build

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: annota-macos-arm64-build
  cancel-in-progress: true

env:
  ANNOTA_VERSION: "0.2.8"
  VENV: ".venv-macos"

jobs:
  build-macos-arm64:
    name: Build and QA macOS ARM64 DMG
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Check out Annota
        uses: actions/checkout@v6

      - name: Set up Python 3.13
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Verify Apple Silicon runner
        run: |
          set -euxo pipefail
          sw_vers
          test "$(uname -m)" = "arm64"
          python3 --version
          gh --version

      - name: Create macOS virtual environment
        run: |
          set -euxo pipefail
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install --upgrade pip

      - name: Install Annota dependencies
        run: |
          set -euxo pipefail
          "$VENV/bin/python" -m pip install -r requirements.txt
          "$VENV/bin/python" -m pip install -r requirements-dev.txt

      - name: Generate native icon resources
        run: |
          set -euxo pipefail
          "$VENV/bin/python" tools/make_icons.py
          test -d assets/Annota.iconset
          iconutil -c icns assets/Annota.iconset -o assets/annota.icns
          test -f assets/annota.icns

      - name: Lint, compile, and run full test suite
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euxo pipefail
          "$VENV/bin/python" -m ruff check main.py tests tools
          "$VENV/bin/python" -m ruff format --check main.py tests tools
          "$VENV/bin/python" -m compileall -q main.py tests tools
          "$VENV/bin/python" -m pytest -q

      - name: Compile native macOS hotkey helper
        run: |
          set -euxo pipefail
          rm -rf .macos-native
          mkdir -p .macos-native
          swiftc tools/annota_hotkey.swift -o .macos-native/annota_hotkey
          chmod +x .macos-native/annota_hotkey
          test -x .macos-native/annota_hotkey

      - name: Verify native Option+Q registration
        run: |
          set -euxo pipefail
          .macos-native/annota_hotkey "Option+Q" >.macos-native/hotkey.out 2>.macos-native/hotkey.err &
          PID=$!
          READY=0
          for _ in {1..30}; do
            if grep -q '^READY Option+Q$' .macos-native/hotkey.out 2>/dev/null; then
              READY=1
              break
            fi
            if ! kill -0 "$PID" 2>/dev/null; then
              cat .macos-native/hotkey.err || true
              exit 1
            fi
            sleep 0.1
          done
          test "$READY" = "1"
          kill "$PID" 2>/dev/null || true
          wait "$PID" 2>/dev/null || true

      - name: Build native Annota.app
        run: |
          set -euxo pipefail
          rm -rf build dist
          "$VENV/bin/python" -m PyInstaller \
            --noconfirm \
            --clean \
            --specpath build \
            --windowed \
            --onedir \
            --name Annota \
            --osx-bundle-identifier net.softwify.annota \
            --icon "$PWD/assets/annota.icns" \
            --add-data "$PWD/assets:assets" \
            --add-binary "$PWD/.macos-native/annota_hotkey:." \
            main.py
          test -d dist/Annota.app

      - name: Sign and verify app
        run: |
          set -euxo pipefail
          codesign --force --deep --sign - dist/Annota.app
          codesign --verify --deep --strict --verbose=2 dist/Annota.app
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' dist/Annota.app/Contents/Info.plist)"
          test "$BUNDLE_ID" = "net.softwify.annota"

      - name: Packaged runtime self-test
        run: |
          set -euxo pipefail
          dist/Annota.app/Contents/MacOS/Annota --self-test

      - name: Packaged launch smoke test
        run: |
          set -euxo pipefail
          dist/Annota.app/Contents/MacOS/Annota --smoke-test &
          PID=$!
          sleep 1
          kill -0 "$PID"
          wait "$PID"

      - name: Package macOS DMG
        run: |
          set -euxo pipefail
          ARCH="$(uname -m)"
          RELEASE_DIR="releases/v${ANNOTA_VERSION}"
          STAGE="$RELEASE_DIR/Annota-v${ANNOTA_VERSION}-macOS-${ARCH}"
          DMG="$RELEASE_DIR/Annota-v${ANNOTA_VERSION}-macOS-${ARCH}.dmg"
          SHA="$DMG.sha256"
          rm -rf "$STAGE" "$DMG" "$SHA"
          mkdir -p "$STAGE"
          cp -R dist/Annota.app "$STAGE/Annota.app"
          cp README.md "$STAGE/README.md"
          cp LICENSE "$STAGE/LICENSE"
          hdiutil create -volname "Annota v${ANNOTA_VERSION}" -srcfolder "$STAGE" -ov -format UDZO "$DMG"
          shasum -a 256 "$DMG" | awk '{print toupper($1) "  " $2}' > "$SHA"
          rm -rf "$STAGE"
          test -f "$DMG"
          test -f "$SHA"
          cat "$SHA"

      - name: Publish macOS QA build as prerelease
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euxo pipefail
          ARCH="$(uname -m)"
          DMG="releases/v${ANNOTA_VERSION}/Annota-v${ANNOTA_VERSION}-macOS-${ARCH}.dmg"
          SHA="$DMG.sha256"
          TAG="v${ANNOTA_VERSION}-macos-rc.${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" "$DMG" "$SHA" \
            --target "$GITHUB_SHA" \
            --title "Annota v${ANNOTA_VERSION} macOS QA RC ${GITHUB_RUN_NUMBER}" \
            --prerelease \
            --notes "macOS ARM64 QA release candidate. The GitHub Apple Silicon runner passed source compilation, the full pytest suite, native Option+Q registration, PyInstaller packaging, code-sign verification, packaged runtime self-test, packaged launch smoke test, DMG creation, and SHA-256 generation. This is intentionally a prerelease until the physical-Mac acceptance test confirms first launch, Screen Recording permission, Accessibility permission, Option+Q, menu-bar controls, annotation/review flow, Retina behavior, and chat insertion/fallback."
